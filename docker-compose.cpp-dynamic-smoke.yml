# Dynamic worker registration smoke deployment using the C++/GGUF backend.
#
# This file is intentionally standalone so it can be used on a shared GPU host
# without touching existing compose projects or default ports.

services:
  cpp-worker-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpp-worker-backend
      args:
        LLAMA_OMNI_REFSPEC: ${LLAMA_OMNI_REFSPEC:-master}
        LLAMA_OMNI_REF: ${LLAMA_OMNI_REF:-origin/master}
    image: minicpm-cpp-worker-backend:dynamic-reg
    container_name: minicpm-dynamic-reg-cpp-wb-0
    environment:
      GPU_ID: "0"
      BACKEND_PORT: "22500"
      WORKER_PORT: "22400"
      GGUF_MODEL: /models/MiniCPM-o-4_5-gguf/${GGUF_MODEL_FILE:-MiniCPM-o-4_5-Q4_K_M.gguf}
      LLAMA_SERVER_EXTRA_ARGS: "${LLAMA_SERVER_EXTRA_ARGS:--c 8192}"
      GATEWAY_REGISTRY_URL: "http://gateway:8007/internal/workers"
      WORKER_ID: "cpp-worker-backend-0"
      WORKER_ENDPOINT: "cpp-worker-backend:22400"
      WORKER_GPU_GROUP: "gpu-${SMOKE_GPU_ID:-1}"
    volumes:
      - ${GGUF_MODEL_HOST_PATH:?set GGUF_MODEL_HOST_PATH to the host GGUF model dir}:/models/MiniCPM-o-4_5-gguf:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SMOKE_GPU_ID:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:22400/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: minicpm-gateway:dynamic-reg
    container_name: minicpm-dynamic-reg-cpp-gateway
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8006"
      - "--internal-port"
      - "8007"
      - "--https"
      - "--ssl-certfile"
      - "/app/certs/cert.pem"
      - "--ssl-keyfile"
      - "/app/certs/key.pem"
    ports:
      - "${GATEWAY_HOST_PORT:-18006}:8006"
    expose:
      - "8007"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${CERTS_HOST_PATH:-./certs}:/app/certs:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
